name: Get Config
run-name: Get Config - ${{ inputs.model }}

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        type: choice
        default: zn-m2_immwrt
        options:
          - zn-m2_immwrt
          - zn-m2_libwrt
      mode:
        required: true
        description: Build Mode
        type: choice
        default: debug
        options:
          - debug
          - config_preview


env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  get_config:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Build System Setup
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix
          sudo -E apt -yqq install libfuse-dev
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload

      - name: Fetch Source Code( 拉取源代码 )
        run: ./core/scripts/fetch_source.sh ${{ inputs.model }}

      - name: Get Firmware Config
        run: ./build.sh ${{ inputs.model }} "${{ inputs.mode }}"

      - name: Upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.model }}
          path: ./output/debug/*